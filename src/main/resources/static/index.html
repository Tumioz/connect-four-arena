<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Four Arena</title>
<style>
:root{--table:#e7eaf0;--ink:#16213e;--mute:#5d6a85;--board:#2140d8;--red:#e63946;--yel:#ffc21a;--rule:#cdd3e0;--surf:#fff;--c:clamp(38px,9.5vw,70px);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--table:#0f1422;--ink:#e8ecf8;--mute:#93a0bd;--board:#3252ee;--rule:#262f48;--surf:#171d31;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--table);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:auto;padding:28px 20px 64px}
h1,h2{font-family:ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;font-weight:800;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(28px,5vw,44px);line-height:1.05;margin-bottom:6px}h2{font-size:19px;margin-bottom:10px}
.mute{color:var(--mute);margin:0}
.play{display:grid;grid-template-columns:auto 1fr;gap:44px;margin-top:22px;align-items:start}@media(max-width:820px){.play{grid-template-columns:1fr}}
.board{position:relative;width:calc(var(--c)*7);height:calc(var(--c)*6);margin:calc(var(--c)*1) 10px 16px;--turn:var(--red)}
.discs,.face,.cols{position:absolute;inset:0;border-radius:12px}
.discs{overflow:hidden}
.face{pointer-events:none;background:radial-gradient(circle closest-side,transparent 0 84%,var(--board) 86%) 0 0/var(--c) var(--c);box-shadow:0 0 0 10px var(--board),0 16px 0 10px color-mix(in srgb,var(--board) 65%,#000)}
.cols{display:grid;grid-template-columns:repeat(7,1fr)}
.col{position:relative;border:0;background:none;cursor:pointer;pointer-events:none}
.board.human .col{pointer-events:auto}
.board.human .col:hover::before{content:"";position:absolute;left:6%;top:calc(var(--c)*-.95);width:88%;aspect-ratio:1;border-radius:50%;background:var(--turn)}
.d{position:absolute;width:calc(var(--c)*.88);height:calc(var(--c)*.88);border-radius:50%;left:calc(var(--col)*var(--c) + var(--c)*.06);bottom:calc(var(--row)*var(--c) + var(--c)*.06);box-shadow:inset 0 0 0 calc(var(--c)*.09) rgba(0,0,0,.14);animation:drop calc(.3s + (6 - var(--row))*.05s) ease-in}
.d.r{background:var(--red)}.d.y{background:var(--yel)}
.d.win{animation:pulse .8s ease-in-out infinite;box-shadow:inset 0 0 0 calc(var(--c)*.09) rgba(255,255,255,.75)}
@keyframes drop{0%{transform:translateY(calc((var(--row) - 7)*var(--c)))}70%{transform:none}84%{transform:translateY(-7%)}100%{transform:none}}
@keyframes pulse{50%{transform:scale(1.1)}}
.seat{display:block;margin-bottom:12px;padding-left:12px;border-left:6px solid var(--red)}.seat.y{border-color:var(--yel)}
.seat span{display:block;font-size:13px;color:var(--mute)}
select{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--surf);color:var(--ink);font:inherit}
.btn{padding:10px 18px;border-radius:10px;border:0;background:var(--ink);color:var(--table);font:700 15px/1 system-ui,sans-serif;cursor:pointer}.btn:disabled{opacity:.5}
#status{font:800 21px/1.3 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;margin:18px 0 0;min-height:56px}
:focus-visible{outline:3px solid var(--board);outline-offset:2px}
.tour{margin-top:48px;padding-top:24px;border-top:2px solid var(--ink)}
.tour .ctl{display:flex;gap:10px;align-items:center;margin:14px 0 8px;flex-wrap:wrap}.tour select{width:auto}
.bar{display:grid;grid-template-columns:110px 1fr 120px 40px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.bar i{height:12px;background:var(--rule);border-radius:9px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--board);border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar strong{text-align:right}@media(max-width:520px){.bar{grid-template-columns:92px 1fr 36px}.bar span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">
<h1>Connect Four Arena</h1>
<p class="mute">Choose who plays each colour. Pick “You” to click a column and drop a disc, or set two bots against each other.</p>
<div class="play">
 <div class="board" id="board"><div class="discs" id="discs"></div><div class="face"></div><div class="cols" id="cols"></div></div>
 <div>
  <h2>Players</h2>
  <label class="seat">Red moves first<span></span><select id="p0"></select></label>
  <label class="seat y">Yellow moves second<span></span><select id="p1"></select></label>
  <button class="btn" id="new">New game</button>
  <p id="status" aria-live="polite"></p>
 </div>
</div>
<section class="tour"><h2>Bot tournament</h2>
 <p class="mute">Every bot plays every other bot. Colours swap each game and the first two moves are random.</p>
 <div class="ctl"><select id="games" aria-label="Games per pairing"><option value="10">10 games per pairing</option><option value="20">20 games per pairing</option></select><button class="btn" id="run">Run tournament</button></div>
 <div id="bars"></div>
</section></div>
<script>
const ROWS=6,COLS=7,NAME=['Red','Yellow'],$=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),say=t=>$('#status').textContent=t;
let moves,h,grid,over,token=0;
async function init(){
 const bots=await(await fetch('/api/bots')).json();
 for(const id of['p0','p1'])$('#'+id).innerHTML='<option value="human">You</option>'+bots.map(b=>`<option>${b}</option>`).join('');
 $('#p0').value='human';$('#p1').value='Minimax-3';
 $('#cols').innerHTML=Array.from({length:COLS},(_,c)=>`<button class="col" data-c="${c}" aria-label="Drop a disc in column ${c+1}"></button>`).join('');
 reset()}
function reset(){token++;moves=[];h=Array(COLS).fill(0);grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));over=false;$('#discs').innerHTML='';loop()}
async function loop(){
 const my=token,B=$('#board');
 while(!over&&my===token){
  const p=moves.length%2,who=$('#p'+p).value;
  B.style.setProperty('--turn',p?'var(--yel)':'var(--red)');B.classList.toggle('human',who==='human');
  if(who==='human'){say(`Your move, ${NAME[p]}`);return}
  say(`${NAME[p]} (${who}) is thinking`);
  const[r]=await Promise.all([fetch(`/api/move?bot=${who}&moves=${moves}`).then(r=>r.json()),sleep(450)]);
  if(my!==token)return;
  if(r.error)return say(r.error);
  place(r.col)}}
function place(c){
 const row=h[c]++,p=moves.length%2+1;moves.push(c);grid[row][c]=p;
 const d=document.createElement('div');d.className='d '+(p===1?'r':'y');d.style.setProperty('--row',row);d.style.setProperty('--col',c);d.dataset.k=row*COLS+c;
 $('#discs').appendChild(d);
 const win=find(row,c,p);
 if(win){over=true;win.forEach(([r,k])=>$('#discs').querySelector(`[data-k="${r*COLS+k}"]`).classList.add('win'));say(`${NAME[p-1]} wins with ${Math.ceil(moves.length/2)} discs`)}
 else if(moves.length===ROWS*COLS){over=true;say('Draw: the board is full')}
 if(over)$('#board').classList.remove('human')}
function find(r,c,p){
 for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){
  const line=[[r,c]];
  for(const s of[1,-1]){let i=r+s*dr,j=c+s*dc;while(i>=0&&i<ROWS&&j>=0&&j<COLS&&grid[i][j]===p){line.push([i,j]);i+=s*dr;j+=s*dc}}
  if(line.length>=4)return line}
 return null}
$('#cols').onclick=e=>{const b=e.target.closest('.col');if(!b||over||!$('#board').classList.contains('human'))return;
 const c=+b.dataset.c;if(h[c]>=ROWS)return say('That column is full. Pick another.');place(c);loop()};
$('#new').onclick=reset;
$('#p0').onchange=$('#p1').onchange=()=>{token++;loop()};
$('#run').onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.textContent='Playing games…';
 try{const s=await(await fetch('/api/tournament?games='+$('#games').value)).json(),max=Math.max(...s.map(x=>x.points),1);
  $('#bars').innerHTML=s.map(x=>`<div class="bar"><b>${x.name}</b><i><u style="width:0" data-w="${x.points*100/max}"></u></i><span>${x.wins}W ${x.draws}D ${x.losses}L</span><strong>${x.points}</strong></div>`).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('#bars u').forEach(u=>u.style.width=u.dataset.w+'%')))}
 catch{$('#bars').textContent='The tournament could not run. Check that the server is still up.'}
 b.disabled=false;b.textContent='Run tournament'};
init();
</script></body></html>
